# Reference household, derived from 18 redacted bills (2025-04-28 -> 2026-08-30).
# This is the fixture every stage of the engine runs against.
#
# Two sections, deliberately separated: what the BILL gives you, and what the
# FORM has to ask. Nothing here is invented.

meta:
  source: 18 redacted GloBird bills, 13 complete cycles used for annual figures
  trailing_12m: 2025-09-01 to 2026-08-30   # 364 days = 13 x 28-day cycles
  extracted: 2026-09-18

# ---------------------------------------------------------------- from the bill
from_bill:
  retailer: GloBird Energy
  network: Energex
  plan: BOOST
  tariff_ref: globird_boost_2026
  has_controlled_load: true

  annual_kwh_total: 7359
  annual_kwh_by_window:
    peak: 1569          # 21.3%   4.31 kWh/day   16:00-21:00
    offpeak: 1745       # 23.7%   4.80 kWh/day   09:00-16:00
    shoulder: 2087      # 28.4%   5.73 kWh/day   21:00-09:00
    controlled_load: 1958   # 26.6%   5.38 kWh/day  separate circuit

  # Every billing period of the trailing 12 months, kWh by window, as read from
  # the bills (data/bills_extracted.csv). The annual figures above are their
  # sums. The generator takes this household's seasonality from these.
  billing_periods:
    - {start: 2025-09-01, days: 28, peak: 97.73, offpeak: 77.84, shoulder: 118.71, controlled_load: 174.92}
    - {start: 2025-09-29, days: 28, peak: 99.55, offpeak: 99.50, shoulder: 97.52, controlled_load: 137.25}
    - {start: 2025-10-27, days: 28, peak: 99.30, offpeak: 110.19, shoulder: 82.87, controlled_load: 124.02}
    - {start: 2025-11-24, days: 28, peak: 160.27, offpeak: 146.53, shoulder: 78.97, controlled_load: 82.56}
    - {start: 2025-12-22, days: 28, peak: 130.07, offpeak: 177.74, shoulder: 74.25, controlled_load: 75.28}
    - {start: 2026-01-19, days: 28, peak: 159.73, offpeak: 184.92, shoulder: 77.91, controlled_load: 102.94}
    - {start: 2026-02-16, days: 28, peak: 136.92, offpeak: 128.77, shoulder: 89.72, controlled_load: 113.99}
    - {start: 2026-03-16, days: 28, peak: 88.32, offpeak: 117.20, shoulder: 79.13, controlled_load: 130.34}
    - {start: 2026-04-13, days: 28, peak: 85.46, offpeak: 95.78, shoulder: 101.85, controlled_load: 160.69}
    - {start: 2026-05-11, days: 28, peak: 97.79, offpeak: 128.51, shoulder: 194.76, controlled_load: 188.15}
    - {start: 2026-06-08, days: 28, peak: 120.93, offpeak: 143.05, shoulder: 317.88, controlled_load: 223.46}
    - {start: 2026-07-06, days: 28, peak: 141.76, offpeak: 160.45, shoulder: 371.81, controlled_load: 213.06}
    - {start: 2026-08-03, days: 28, peak: 150.90, offpeak: 174.95, shoulder: 401.69, controlled_load: 231.56}

  annual_cost_aud_as_billed: 2509.59
  annual_cost_aud_at_2026_rates: 2624.54   # use this as the no-change baseline

  seasonality:
    peak_period: winter            # NOT summer -- see note below
    highest_daily_kwh: 34.3        # Aug 2026
    lowest_daily_kwh: 14.8         # Mar-Apr 2026
    ratio: 2.3
    driver: overnight shoulder load (21:00-09:00) in winter months

# ------------------------------------------------------------- must be asked
# Answers to the form's questions (QUESTIONS in src/profile.py); null where the
# household has not given one. Solar is here because the form asks it; the
# bills confirm it, showing no export.
#
# Not asked: household size (2 adults, 2 children, stated by the project lead).
# The bill fixes the magnitude, so a person count moves nothing computed.
from_form:
  has_solar: false
  has_battery: null
  home_during_the_day: null       # work from home? school hours?
  work_from_home_days: null
  aircon: null                    # the winter shoulder load needs explaining
  pool_pump: null
  hot_water: electric_controlled_load  # from the bill: its controlled-load circuit carries
                                       # 1,958 kWh a year
  ev: null
  ev_planned_year: null
  years_expected_in_home: null
  max_upfront_aud: null
  motivation: null                # lower_bill / independence / backup_power

# ------------------------------------------------------------------- warnings
notes:
  - >
    The 2025-12-22 bill contains TWO rate blocks in one billing period, because
    prices changed on 2026-01-01. Reading only the first block understates that
    period's consumption by 57% (192 kWh instead of 457 kWh). Any extraction
    step must sum all blocks and reconcile against the printed "Total Usage".
  - >
    Year-on-year variation in the same season is large: Jun-Jul consumption fell
    34% from 2025 to 2026, while August rose 23%. One year of bills is not a
    stable baseline. Do not present a single-year projection as precise.
  - >
    Controlled load (1958 kWh/yr, 27% of consumption) sits on a separate circuit
    at the cheapest rate. A household battery cannot serve it. Excluding it,
    addressable consumption is 5401 kWh/yr.
  - >
    Adding solar does not make this household's battery worthwhile. Solar comes
    first for this household (solar_first), but with panels added the battery's
    payback bottoms out at 13.5 years from about 6.6 kW upward -- outside the
    10-year warranty (installed 2026-09-29, new solar at a 5 c/kWh feed-in).
    The battery's output levels off near 2,100 kWh a year. In winter it is
    already full on most days (63 of 92, June-August) and empties into the peak
    window and then the overnight shoulder load, so more panels add almost
    nothing; in summer it never fills, because solar covers the early part of
    the peak window itself and little evening load is left. The EV -> solar ->
    battery chain in CLAUDE.md's domain facts fails at its last step here.
