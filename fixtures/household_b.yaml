# SYNTHETIC household. Not a real bill. Constructed deliberately to contrast
# with fixtures/reference_household.yaml on every axis that could be overfitted.
#
#   reference_household.yaml        household_b.yaml
#   time-of-use   ->  flat
#   no solar      ->  6.6 kW solar
#   winter peak   ->  summer peak
#   7359 kWh/yr   ->  4800 kWh/yr
#   controlled load   none
#   4 occupants   ->  2 occupants, both out weekdays
#
# Rates are indicative SEQ retail values for 2025-26, not a specific offer.
# If a test passes for reference_household.yaml and fails here, the code is fitted to one
# household.

meta:
  source: synthetic — constructed as a contrast case, not derived from a bill
  purpose: generalisation test
  created: 2026-09-18

from_bill:
  retailer: null
  network: Energex
  plan: synthetic flat
  tariff_ref: generic_flat_2026
  has_solar: true
  solar_kw: 6.6
  has_controlled_load: false

  annual_kwh_total: 4800          # grid import + self-consumed solar
  annual_kwh_by_window:
    all_day: 4800                 # a flat tariff has ONE window
  # NOTE: a flat-tariff bill gives magnitude but NO shape. The window split
  # that reference_household.yaml gets for free does not exist here. The generator must lean
  # much harder on the form, and the result carries more uncertainty. The
  # system should say so.

  # SYNTHETIC, like the rest of this file. Built from the seasonality summary
  # below: daily use follows a cosine peaking in mid-January with the stated
  # highest/lowest ratio (19.5 / 9.1), scaled so the 13 periods sum to 4,800
  # kWh. A 4,800 kWh year cannot also reach both stated extremes, so the
  # periods run from 8.4 to 17.9 kWh/day. Totals only: a flat bill has no
  # window split.
  billing_periods:
    - {start: 2025-09-01, days: 28, all_day: 301.33}
    - {start: 2025-09-29, days: 28, all_day: 362.70}
    - {start: 2025-10-27, days: 28, all_day: 425.49}
    - {start: 2025-11-24, days: 28, all_day: 475.40}
    - {start: 2025-12-22, days: 28, all_day: 501.07}
    - {start: 2026-01-19, days: 28, all_day: 496.67}
    - {start: 2026-02-16, days: 28, all_day: 463.20}
    - {start: 2026-03-16, days: 28, all_day: 408.27}
    - {start: 2026-04-13, days: 28, all_day: 344.38}
    - {start: 2026-05-11, days: 28, all_day: 286.07}
    - {start: 2026-06-08, days: 28, all_day: 246.61}
    - {start: 2026-07-06, days: 28, all_day: 234.98}
    - {start: 2026-08-03, days: 28, all_day: 253.83}

  annual_solar_export_kwh: 6900
  annual_cost_aud_at_2026_rates: 1264.00

  seasonality:
    peak_period: summer
    highest_daily_kwh: 19.5       # January, air conditioning
    lowest_daily_kwh: 9.1         # July
    ratio: 2.1
    driver: afternoon and evening air conditioning

from_form:
  household_size: 2
  occupancy_pattern: both_out_weekdays
  has_aircon: true
  aircon_use: summer_evenings
  controlled_load_appliance: none
  has_pool: false
  roof_orientation: north
  roof_shading: none
  usable_roof_area_m2: 40
  years_expected_in_home: 12
  max_upfront_spend_aud: 15000
  considering_ev: false
  motivation: [lower_bill, independence]

notes:
  - >
    No fixture reaches battery_now at current prices, and this one is no
    exception. That is a finding, not a modelling failure. Solar is already
    installed and the household is out during generation hours, so most output
    is exported at a low feed-in tariff while evening consumption is bought
    back at the full rate: the strongest case for a battery of the three. Yet
    at $8,806 net (sourced prices, 2026-09-26) the half-hourly dispatch gives
    a payback of 12.5 years, against a 10-year warranty and a 12-year expected
    stay. Two things hold it there: the battery is too small for summer
    evenings with air conditioning, and cloudy days leave it unfilled.
    Removing either constraint alone gives 11.9 years. Only the ceiling gets
    inside the warranty, at 9.2 years, and it means displacing the entire
    3,903 kWh annual import implied by the bill, which is physically
    impossible.
  - >
    This is the fixture expected to reach battery_now first under a cost or
    tariff change. Until then it shares battery_not_yet with
    reference_household.yaml, but not the reason. Here the binding constraint
    is battery capacity and available surplus: summer evenings exceed 10 kWh
    and cloudy days leave the battery unfilled, leaving 408 kWh of imports
    unmet. There it is evening demand: peak-window use never exceeds 5.7 kWh
    against a 10 kWh battery. Identical labels are acceptable; identical
    reasoning means the engine is not discriminating.
  - >
    Charge opportunity cost here is the feed-in tariff forgone, not an offpeak
    import rate. Both paths must work.
