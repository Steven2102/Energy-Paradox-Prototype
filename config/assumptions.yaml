# Modelling assumptions: choices the engine needs that neither the bill nor the
# form supplies. Estimated rather than measured, so any result they shape must
# say so. Scalars carry a range beside the point value, like the rest of
# config/, for the sensitivity sweeps at stage 4.
#
# ESTIMATES, NOT SOURCED: the day shapes, air-conditioning hours, cloudiness,
# solar comparison, EV charging and sweep ranges below are the modeller's
# judgement.
# Replace them with measured figures if any become available.

# ------------------------------------------------------------------- dispatch

dispatch_horizon_hours: 24
dispatch_horizon_hours_range: [24, 48]
# How far ahead the battery plans: energy stored now is only ever set against
# consumption in the next 24 hours. This moves the result. At 48 hours
# dispatch matches the LP optimum exactly, and household_b's payback becomes
# 12.2 years instead of 12.5 (sourced prices, September 2026). Keeping 24 is
# deliberate: the LP has perfect foresight over the whole year, so it is an
# upper bound rather than a target, and a real controller does not know 48
# hours of cloud in advance.

# ---------------------------------------------------------- use within a day
# How a day's use spreads across its hours. On a time-of-use bill these shapes
# only decide the shape inside each tariff window, because the bill already
# says how much was used in each window. On a flat bill they are the whole
# time-of-day shape, which is why a flat-tariff result is less certain.
#
# Each shape shares the day across blocks of hours, evenly within a block.
# Overnight and away-from-home blocks share one baseload intensity. The
# daytime block is the least certain, so it carries a range; if it moves, the
# other blocks scale to keep the day's total.

day_shapes:
  home_all_day:
    - {hours: [0, 6],   share: 0.11}
    - {hours: [6, 9],   share: 0.14}
    - {hours: [9, 16],  share: 0.30, share_range: [0.22, 0.38]}
    - {hours: [16, 21], share: 0.33}
    - {hours: [21, 24], share: 0.12}
  out_during_the_day:
    - {hours: [0, 6],   share: 0.12}
    - {hours: [6, 9],   share: 0.17}
    - {hours: [9, 16],  share: 0.14, share_range: [0.10, 0.20]}
    - {hours: [16, 21], share: 0.43}
    - {hours: [21, 24], share: 0.14}

# Which shape each day takes, from the form. A day someone is home takes
# `home`: every weekend day, every weekday where someone is home during the
# day, and each work-from-home day (counted from Monday). Other weekdays take
# `away`. Where the form does not say, every day takes `not_stated`.
occupancy:
  home: home_all_day
  away: out_during_the_day
  not_stated: home_all_day

# When air conditioning runs, by type. Each billing period's use above the
# household's lowest period is treated as air conditioning and spread evenly
# over these hours; the rest of the day follows the occupancy shape.
aircon_hours:
  split:  [16, 22]
  ducted: [12, 22]

# ---------------------------------------------------------------------- solar
# Clear-sky days under a seasonal envelope, with cloudy days, scaled so the
# year's export without a battery matches the bill. No irradiance data.

solar_latitude_deg: -27.5   # South East Queensland; sets day length through the year
solar_noon_hour: 11.8       # AEST; Brisbane sits 3 degrees east of the zone meridian

solar_june_to_december_ratio: 0.5
solar_june_to_december_ratio_range: [0.45, 0.75]
# A mid-June day's output against a mid-December one. About half for a flat
# array in Brisbane; a steeper north-facing roof narrows the gap.

cloudy_day_share: 0.25
cloudy_day_share_range: [0.15, 0.40]
cloudy_day_output: 0.40
cloudy_day_output_range: [0.20, 0.60]
# Cloudiness as days rather than a constant derating: calibrating to the bill's
# export would cancel a constant, so the factor matters only as variation
# between days, which is what decides whether a battery fills. Cloudy days are
# spread evenly through the year: one in four, at 40% output.
#
# Even spacing is optimistic. Real cloud comes in runs, and consecutive cloudy
# days drain a battery with no chance to refill in between. Clustering is
# deliberately not modelled; treat the result as the favourable end.

solar_yield_kwh_per_kw: 1400
solar_yield_kwh_per_kw_range: [1200, 1600]
# A year's output per kW of panels in South East Queensland, for solar the
# household does not have yet. Existing solar is scaled to the bill instead.

new_solar_feed_in_aud_per_kwh: 0.05
new_solar_feed_in_aud_per_kwh_range: [0.03, 0.10]
# The export rate for newly added solar where the tariff has none. SEQ feed-in
# tariffs run roughly 3-10 c/kWh.

# --------------------------------------------------------------- solar_first
# A coarse, indicative comparison and nothing more -- not a PV model:
#   generation    = kw × solar_yield_kwh_per_kw
#   self_consumed = generation × self_consumption, capped at the billed use in
#                   the tariff window covering midday
#   saving        = self_consumed × that window's rate + the rest × feed-in
#   payback       = kw × installed_aud_per_kw / saving
# It decides only whether solar_first outranks a battery answer: it does when
# its payback is at most payback_ratio of the battery's. It is never quoted as
# a precise payback.
indicative_solar:
  kw: 6.6
  kw_range: [3.0, 10.0]
  self_consumption: 0.30
  self_consumption_range: [0.20, 0.50]
  installed_aud_per_kw: 1000          # after the small-scale certificate discount
  installed_aud_per_kw_range: [800, 1400]
  payback_ratio: 0.5
  payback_ratio_range: [0.33, 0.67]

# ------------------------------------------------------------------------ EV
# An EV the household does not have yet, for the adding-an-EV sweep: charging
# the bills do not contain, added in these hours every day. Overnight, because
# that is where EV charging lands (CLAUDE.md). A planned EV is read against a
# typical one: about 12,000 km a year at about 0.17 kWh/km.
ev_charging_hours: [22, 6]  # wraps midnight: 22:00 to 06:00
ev_kwh_per_year: 2000
ev_kwh_per_year_range: [1000, 4000]

# ------------------------------------------------------------ revisit sweeps
# The plausible range each revisit_if sweep searches. A threshold outside it is
# reported as "no change within the range", not extrapolated.
revisit_ranges:
  battery_cost_share: [0.5, 1.5]                 # of today's installed price
  feed_in_aud_per_kwh: [0.0, 0.15]
  rate_spread_change_aud_per_kwh: [-0.10, 0.20]  # added to the dearest window's rate
  added_solar_kw: [0.0, 10.0]
  added_ev_kwh_per_year: [0, 5000]               # of EV charging the bills do not contain
